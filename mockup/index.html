<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <title>Tank Build Board · Design preview</title>
    <style>
      :root {
        --bg: #f3f3f1;
        --surface: #fff;
        --ink: #252724;
        --muted: #666c65;
        --line: #e6e7e3;
        --green: #176647;
        --green-bg: #e5f3eb;
        --red: #b83930;
        --red-bg: #fff0ed;
        --amber: #865b0c;
        --amber-bg: #fff4da;
        --blue: #416bad;
        --shadow: 0 1px 2px #19281c08, 0 3px 8px #19281c03;
        --radius: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button {
        color: inherit;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      a {
        color: var(--green);
      }
      button:focus-visible,
      a:focus-visible,
      summary:focus-visible {
        outline: 3px solid #528ce2;
        outline-offset: 3px;
      }
      input:focus,
      select:focus {
        outline: 2px solid #528ce2;
        outline-offset: 1px;
      }
      button svg {
        pointer-events: none;
      }
      svg {
        vertical-align: middle;
        flex-shrink: 0;
      }
      .icon {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .num {
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.025em;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
      .skip {
        position: fixed;
        top: -80px;
        left: 12px;
        background: white;
        padding: 12px;
        z-index: 100;
      }
      .skip:focus {
        top: 12px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 28px;
        line-height: 1.25;
        letter-spacing: -1px;
        font-weight: 670;
      }
      h2 {
        font-size: 17px;
        letter-spacing: -0.35px;
        font-weight: 650;
      }
      h3 {
        font-size: 15px;
        font-weight: 650;
      }
      p + p {
        margin-top: 8px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .between {
        justify-content: space-between;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .btn {
        border: 1px solid #d7dad4;
        border-radius: 8px;
        min-height: 44px;
        padding: 10px 15px;
        background: #fff;
        font-size: 13px;
        font-weight: 600;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        box-shadow: 0 1px 1px #00000006;
        text-decoration: none;
      }
      .btn:hover {
        background: #f8f9f6;
      }
      .btn.primary {
        background: #30382f;
        border-color: #30382f;
        color: white;
        box-shadow:
          inset 0 1px 0 #ffffff24,
          0 1px 2px #0002;
      }
      .btn.primary:hover {
        background: #1d271d;
      }
      .btn.green {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }
      .btn.quiet {
        border: 0;
        box-shadow: none;
        background: transparent;
      }
      .btn.compact {
        padding: 7px 11px;
        min-height: 36px;
      }
      .text-btn {
        padding: 10px 0;
        border: 0;
        background: transparent;
        color: var(--green);
        font-size: 13px;
        font-weight: 600;
        min-height: 44px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.5;
        padding: 3px 8px;
        border-radius: 6px;
        background: #f0f1ed;
        white-space: nowrap;
      }
      .pill.red {
        background: #fee2db;
        color: #9c3026;
      }
      .pill.amber {
        background: #ffedbf;
        color: #75520b;
      }
      .pill.green {
        background: #ddf1e4;
        color: #1b6340;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
      }
      .up {
        color: var(--green);
      }
      .down {
        color: var(--red);
      }
      .preview {
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        background: #e5ebe3;
        color: #496046;
        font-size: 11px;
        border-bottom: 1px solid #dce2d8;
        position: relative;
        z-index: 4;
      }
      .preview b {
        font-weight: 650;
      }
      .preview button {
        position: absolute;
        right: 20px;
        border: 0;
        background: none;
        color: #405b3e;
        font-size: 11px;
        text-decoration: underline;
        min-height: 30px;
      }
      .sidebar {
        width: 218px;
        position: fixed;
        left: 0;
        top: 35px;
        bottom: 0;
        background: #ebece8;
        border-right: 1px solid #e0e2db;
        display: flex;
        flex-direction: column;
        padding: 28px 14px 18px;
        z-index: 3;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 0 8px 31px;
      }
      .brand-mark {
        width: 35px;
        height: 39px;
        background: #244e37;
        border-radius: 10px 10px 13px 13px;
        color: white;
        display: grid;
        place-items: center;
        box-shadow: inset 0 0 0 1px #fff2;
      }
      .brand strong {
        font-size: 14px;
        letter-spacing: -0.4px;
        display: block;
      }
      .brand small {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      .nav-label {
        font-size: 10px;
        color: #7c8079;
        letter-spacing: 1px;
        font-weight: 600;
        padding: 0 13px 11px;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 11px 13px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #5e645b;
        font-weight: 550;
        text-align: left;
        min-height: 45px;
      }
      .nav button:hover {
        background: #e2e6dd;
      }
      .nav button[aria-current="page"] {
        background: #d9e6d5;
        color: #254c2e;
        box-shadow: 0 1px 2px #00000003;
      }
      .nav button .nav-count {
        margin-left: auto;
        border-radius: 5px;
        min-width: 20px;
        text-align: center;
        background: #f3d9b1;
        color: #795015;
        font-size: 10px;
        padding: 1px 4px;
      }
      .sidebar-bottom {
        margin-top: auto;
      }
      .sidebar-note {
        margin: 20px 10px;
        padding: 13px 0;
        border-top: 1px solid #d9ddd4;
        font-size: 11px;
        color: #747a70;
      }
      .person {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 4px 9px;
      }
      .avatar {
        width: 31px;
        height: 31px;
        border-radius: 9px;
        background: #d7dfcb;
        display: grid;
        place-items: center;
        color: #506347;
        font-size: 12px;
        font-weight: 650;
      }
      .person strong {
        display: block;
        font-size: 12px;
      }
      .person small {
        font-size: 10px;
        color: var(--muted);
      }
      .main-shell {
        margin-left: 218px;
      }
      .topbar {
        height: 69px;
        border-bottom: 1px solid #e4e5e0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 38px;
        background: #f9faf7;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #71776c;
        font-size: 12px;
      }
      .breadcrumb b {
        font-weight: 500;
        color: #363d33;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 17px;
        color: #747a70;
        font-size: 11px;
      }
      .sync-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #2e8c5a;
        border-radius: 50%;
        margin-right: 5px;
      }
      .mobile-brand {
        display: none;
      }
      .content {
        max-width: 1280px;
        margin: auto;
        padding: 33px 38px 24px;
      }
      .page-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 25px;
      }
      .page-heading p {
        margin-top: 7px;
        color: var(--muted);
        font-size: 13px;
      }
      .heading-actions {
        display: flex;
        gap: 8px;
        padding-top: 3px;
      }
      .eyebrow {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        font-weight: 650;
        color: #7d8477;
        margin-bottom: 7px;
      }
      .panel {
        background: white;
        border: 1px solid #e1e4dc;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .panel-head {
        padding: 19px 21px 15px;
      }
      .panel-head p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
      }
      .panel-body {
        padding: 0 21px 21px;
      }
      .notice {
        border: 1px solid #f2c9bd;
        background: #fff6f2;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 17px 19px;
        margin-bottom: 23px;
      }
      .notice > .icon {
        color: #ba4a32;
        background: #ffe5db;
        border-radius: 50%;
        box-sizing: content-box;
        padding: 7px;
        width: 18px;
        height: 18px;
      }
      .notice strong {
        font-size: 13px;
        font-weight: 650;
      }
      .notice p {
        font-size: 12px;
        color: #916458;
        margin-top: 2px;
      }
      .notice .btn {
        margin-left: auto;
        background: #fffaf8;
        border-color: #e6c9bd;
        white-space: nowrap;
        font-size: 12px;
        min-height: 37px;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        margin-bottom: 28px;
      }
      .summary-item {
        padding: 0 22px;
        border-left: 1px solid #dfe2d9;
      }
      .summary-item:first-child {
        padding-left: 2px;
        border-left: 0;
      }
      .summary-item .label {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 5px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .summary-item strong {
        font-size: 27px;
        font-weight: 650;
        line-height: 1.2;
      }
      .summary-item small {
        font-size: 11px;
        margin-left: 9px;
        color: var(--muted);
      }
      .section-heading {
        margin-bottom: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .section-heading h2 {
        font-size: 15px;
      }
      .segmented {
        display: inline-flex;
        border: 1px solid #dfe2d9;
        border-color: #dfe2d9;
        padding: 3px;
        border-radius: 8px;
        background: #e9ece5;
        gap: 2px;
      }
      .segmented button {
        min-height: 32px;
        padding: 5px 11px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        font-size: 11px;
        color: #666e5f;
        font-weight: 550;
      }
      .segmented button[aria-pressed="true"] {
        background: #fff;
        color: #343d2e;
        box-shadow: 0 1px 3px #1d281a18;
      }
      .product-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 16px;
      }
      .product {
        grid-column: span 3;
        overflow: hidden;
      }
      .product.secondary {
        grid-column: span 2;
      }
      .product-main {
        padding: 21px 22px 18px;
        position: relative;
        overflow: hidden;
      }
      .product-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        position: relative;
        z-index: 1;
      }
      .product-title {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .product-title .mini-icon {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #f2f3ee;
        color: #76806c;
        display: grid;
        place-items: center;
      }
      .product-title small {
        display: block;
        font-size: 10px;
        color: var(--muted);
        margin-top: 1px;
      }
      .product-title h3 {
        font-size: 15px;
        letter-spacing: -0.3px;
      }
      .product-numbers {
        display: flex;
        align-items: flex-end;
        gap: 28px;
        margin-top: 19px;
        position: relative;
        z-index: 1;
      }
      .product-numbers .build-number {
        font-size: 48px;
        line-height: 1.05;
        font-weight: 620;
        letter-spacing: -2px;
      }
      .product-numbers .sale-number {
        font-size: 25px;
        line-height: 1.2;
        font-weight: 550;
        letter-spacing: -0.6px;
      }
      .product-numbers .metric-label {
        font-size: 11px;
        color: var(--muted);
        margin-top: 5px;
      }
      .sale {
        padding-bottom: 2px;
      }
      .tank-art {
        position: absolute;
        right: 15px;
        bottom: 7px;
        width: 83px;
        height: 120px;
        opacity: 0.87;
        filter: drop-shadow(0 5px 3px #26372510);
      }
      .product-cover {
        padding: 0 22px 15px;
      }
      .cover-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .cover-line b {
        font-weight: 600;
        color: #444d3c;
      }
      .cover-track {
        height: 5px;
        background: #ebeee7;
        border-radius: 4px;
        margin: 8px 0 10px;
        overflow: hidden;
      }
      .cover-track i {
        display: block;
        height: 100%;
        border-radius: 4px;
        background: #b0c698;
      }
      .product.red .cover-track i {
        background: #d68475;
      }
      .product.amber .cover-track i {
        background: #c6ab66;
      }
      .trend-caption {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .trend-caption b {
        font-size: 11px;
        font-weight: 600;
      }
      .product-foot {
        border-top: 1px solid #eee;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 10px 22px;
        background: #fcfdfa;
        font-size: 11px;
        min-height: 44px;
      }
      .product-foot span {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #68715f;
      }
      .product-foot .icon {
        width: 14px;
        height: 14px;
      }
      .product-foot button {
        border: 0;
        background: transparent;
        font-size: 11px;
        color: #66765a;
        min-height: 26px;
        padding: 2px 0 2px 6px;
      }
      .product-foot button:hover {
        text-decoration: underline;
      }
      .secondary .product-main {
        padding: 18px 19px 15px;
      }
      .secondary .product-title h3 {
        font-size: 13px;
      }
      .secondary .product-title .mini-icon {
        display: none;
      }
      .secondary .product-numbers {
        margin-top: 18px;
        gap: 25px;
      }
      .secondary .build-number {
        font-size: 36px;
        letter-spacing: -1.4px;
      }
      .secondary .sale-number {
        font-size: 21px;
      }
      .secondary .product-cover {
        padding: 0 19px 13px;
      }
      .secondary .product-foot {
        padding: 9px 19px;
      }
      .recipe-details {
        padding: 5px 20px 13px;
        border-top: 1px solid var(--line);
        background: #fafbf8;
      }
      .recipe-line {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 11px;
        padding: 7px 0;
        border-bottom: 1px solid #e8ebe2;
      }
      .recipe-line:last-child {
        border-bottom: 0;
      }
      .recipe-details p {
        font-size: 10px;
        color: var(--muted);
        padding-top: 6px;
      }
      .explanation {
        font-size: 11px;
        line-height: 1.7;
        color: #777d70;
        margin: 12px 1px 24px;
      }
      .explanation summary {
        cursor: pointer;
        color: #697360;
        min-height: 30px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .explanation p {
        max-width: 740px;
        margin: 4px 0 10px;
      }
      .bottom-grid {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 16px;
      }
      .task-line {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }
      .task-dot {
        width: 7px;
        height: 7px;
        background: #cc8e79;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .task-dot.amber {
        background: #c0a15d;
      }
      .task-line .grow {
        flex: 1;
      }
      .task-line b {
        font-size: 12px;
        font-weight: 600;
      }
      .task-line p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      .task-line .btn {
        font-size: 11px;
        min-height: 33px;
        padding: 5px 9px;
      }
      .mix-track {
        display: flex;
        height: 13px;
        border-radius: 5px;
        overflow: hidden;
        background: #eee;
        margin: 19px 0 15px;
        gap: 3px;
      }
      .mix-track .lite {
        background: #627c4c;
      }
      .mix-track .pro {
        background: #a5b890;
      }
      .mix-labels {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
      }
      .mix-labels b {
        color: #434d3a;
      }
      .legend-dot {
        width: 7px;
        height: 7px;
        border-radius: 2px;
        display: inline-block;
        background: #627c4c;
        margin-right: 5px;
      }
      .legend-dot.pro {
        background: #a5b890;
      }
      .panel-footer {
        padding: 10px 21px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .panel-footer .text-btn {
        min-height: 28px;
        font-size: 11px;
      }
      .page-footer {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 30px;
        padding-top: 15px;
        border-top: 1px solid #dfe3d7;
        color: #81877a;
        font-size: 10px;
      }
      .bottom-nav {
        display: none;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #d6dbce;
        background: white;
        border-radius: 8px;
        padding: 0 11px;
        max-width: 320px;
        width: 100%;
        height: 42px;
        color: var(--muted);
      }
      .search input {
        border: 0;
        background: none;
        width: 100%;
        height: 38px;
        font-size: 12px;
        outline: 0;
      }
      .filters {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .filters button {
        border: 1px solid #dce0d5;
        background: transparent;
        border-radius: 7px;
        padding: 8px 12px;
        font-size: 12px;
        min-height: 40px;
      }
      .filters button[aria-pressed="true"] {
        background: #e0e9d7;
        border-color: #cfdbc3;
        color: #35512a;
      }
      .part-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      .part-table th {
        font-weight: 550;
        font-size: 10px;
        color: var(--muted);
        padding: 12px 17px;
        background: #fafbf8;

   Garage/shed splits are temporary UI drafts: they are NOT extra metaobject fields. */
      const TODAY = new Date("2026-10-22T12:00:00+10:00");

        {

          at: tank_board_settings.sync.at,
          kind: "order",
          sku: "",
          qty: 3,
          who: "Shopify orders #1840–1842",
          changes: [
            { code: "RESIN", delta: -35 },
            { code: "TANK-817", delta: -2 },
            { code: "TANK-824", delta: -1 },
          ],
          skipped: [],
          value: 0,
          recorded_by: "Daily sync",
          undoes: "",
          summary: "3 orders taken off stock",
        },
        {
          handle: "demo-count",
          at: "2026-10-21T16:40:00+10:00",
          kind: "count",
          sku: "",
          qty: 1,
          who: "Garage + shed",
          changes: [{ code: "HANDLE", from: 280, to: 284 }],
          skipped: [],
          value: 0,

          undoes: "",
          summary: "Handles counted",
        },
      ];
      const INITIAL = JSON.stringify({
        parts: tank_board_part,

      });
      let parts = structuredClone(tank_board_part),
        movements = structuredClone(tank_board_movement);
      let page = "home",
        stockView = "now",
        partFilter = "all",
        partSearch = "",
        historySearch = "",
        historyKind = "all",
        action = "count",
        countIndex = 0,

      const names = {

      const $ = (s) => document.querySelector(s),

      const esc = (s) =>

      const byCode = (code) => parts.find((p) => p.code === code);
      const bySku = (sku) => tank_board_product.find((p) => p.sku === sku);
      const date = (d) =>

          month: "short",
          timeZone: "Australia/Brisbane",

      const time = (d) =>
        new Date(d).toLocaleTimeString("en-AU", {
          hour: "numeric",
          minute: "2-digit",
          timeZone: "Australia/Brisbane",
        });
      const weeks = (units, rate) =>
        rate ? ((units / rate) * SALES_DAYS) / DAYS_PER_WEEK : null;
      const severity = (w) =>
        w === null
          ? "amber"
          : w < 6
            ? "red"
            : w < 12 - 0.05
              ? "amber"
              : "green";
      const trend = (p) =>
        p.prev_sales
          ? Math.round((p.monthly_sales / p.prev_sales - 1) * 100)
          : null;
      function trendText(p) {
        const n = trend(p);
        return n === null
          ? "New sales"
          : `${n >= 0 ? "↑" : "↓"} ${Math.abs(n)}%`;
      }
      function pace(code) {
        return tank_board_product.reduce(
          (sum, p) =>
            sum +
            p.monthly_sales *
              p.parts
                .filter((i) => i.code === code)
                .reduce((a, i) => a + i.qty, 0),
          0,
        );
      }
      function partInfo(p) {
        const rate = pace(p.code),
          w = weeks(p.on_hand, rate),
          due = rate
            ? new Date(
                TODAY.getTime() +
                  ((p.on_hand / rate) * SALES_DAYS - p.lead_days) * 86400000,
              )
            : null;
        return {
          p,
          rate,
          w,
          due,
          sev:
            due && due < TODAY
              ? "red"
              : due && due.getTime() - TODAY.getTime() < 14 * 86400000
                ? "amber"
                : "green",
        };
      }
      /* Daily sync policy: floor of two each where stock permits, then one unit to
   the eligible product with the lowest units / monthly_sales. A capped product
   leaves the queue. Stable SKU order breaks ties. Never promise the same part twice.
   Cap is floored to avoid promising more than 84 days' cover (12 weeks).
   A zero-sales product receives only the floor and has no inferred sales cover. */
      function allocate(includeWater = false) {
        const pool = Object.fromEntries(
          parts.map((p) => [
            p.code,
            p.on_hand + (includeWater ? p.on_water : 0),
          ]),
        );
        const result = tank_board_product.map((p) => ({
          p,
          n: 0,
          cap:
            p.monthly_sales > 0
              ? Math.max(
                  2,
                  Math.floor((p.monthly_sales * MAX_COVER_DAYS) / SALES_DAYS),
                )
              : 2,
          blocked: null,
        }));
        const short = (r) =>
          r.p.parts.find(
            (i) => pool[i.code] === undefined || pool[i.code] + 1e-8 < i.qty,
          );
        const give = (r) => {
          r.p.parts.forEach((i) => {
            pool[i.code] -= i.qty;
          });
          r.n++;
        };
        for (let floor = 0; floor < 2; floor++)
          for (const r of result) if (!short(r)) give(r);
        while (true) {
          const eligible = result.filter(
            (r) => r.p.monthly_sales > 0 && r.n < r.cap && !short(r),
          );
          if (!eligible.length) break;
          eligible.sort(
            (a, b) => a.n / a.p.monthly_sales - b.n / b.p.monthly_sales,
          );
          give(eligible[0]);
        }
        for (const r of result) {
          r.blocked = r.n >= r.cap ? null : short(r)?.code;
          r.w = weeks(r.n, r.p.monthly_sales);
          r.atCap = r.n >= r.cap;
          r.sev = r.atCap ? "green" : severity(r.w);
        }
        return { result, pool };
      }

for this product." : ""}</p></div></article>`;

ad"><h2>Next on your list</h2><p>Parts to order before they run out.</p></div><div class="panel-body">${urgent

      function historyRow(m, short = false) {
        const undone = movements.some((x) => x.undoes === m.handle);
        return `<article class="history-row"><div class="history-icon">${icon(m.kind === "receive" ? "in" : m.kind === "count" ? "count" : m.kind === "putback" ? "back" : "out")}</div><div class="body"><h3>${esc(m.summary)} <span class="pill ${m.kind === "faulty" ? "red" : m.kind === "putback" ? "green" : ""}">${undone ? "Undone" : whyLabels[m.kind] || m.kind}</span></h3><p>${date(m.at)}, ${time(m.at)} · ${esc(m.who || m.recorded_by)}${m.recorded_by === "Daily sync" ? " · Daily sync" : ""}</p>${!short ? `<details><summary>${m.changes.length} part${m.changes.length === 1 ? "" : "s"} changed · View details</summary><div>${movementDetails(m)}</div></details>` : ""}</div>${canUndo(m) ? `<button class="btn" data-undo="${esc(m.handle)}">${m.changes.some((c) => c.delta < 0) ? "Put back" : "Undo"}</button>` : ""}</article>`;
      }
      function historyResults() {
        const rows = movements.filter(
          (m) =>
            (historyKind === "all" || m.kind === historyKind) &&
            `${m.summary} ${m.who} ${movementDetails(m)}`
              .toLowerCase()
              .includes(historySearch.toLowerCase()),
        );
        return rows.length
          ? `<div class="history-group">${rows.length} change${rows.length === 1 ? "" : "s"} · Latest first</div>${rows.map((m) => historyRow(m)).join("")}`
          : '<div class="empty">No changes match this search.</div>';
      }
      function historyPage() {
        return (
          heading(
            "The full story, on record.",
            "Stock counts, deliveries and stock out — with a way back.",
          ) +
          `<div class="toolbar"><label class="search">${icon("search")}<input type="search" id="history-search" aria-label="Search history" placeholder="Find an order, part or change…" value="${esc(historySearch)}"></label><div class="history-controls"><select id="history-kind" aria-label="Filter history by type"><option value="all">All changes</option>${Object.entries(
            whyLabels,
          )
            .map(
              ([k, v]) =>
                `<option value="${k}" ${historyKind === k ? "selected" : ""}>${v}</option>`,
            )
            .join(
              "",
            )}</select><span class="small muted">Sample history</span></div></div><section class="panel" id="history-results" aria-label="Stock change history">${historyResults()}</section><p class="explanation">Daily sync entries are read-only here. This helps avoid putting fulfilled orders back into stock by mistake. Demo changes appear here as you try the Actions screen.</p>`
        );
      }
      function render() {
        nav();
        $("#main").innerHTML =
          {
            home,
            parts: partsPage,
            trends: trendsPage,
            actions: actionsPage,
            history: historyPage,
          }[page]() + footer();
      }
      function go(next) {
        page = next;
        render();
        window.scrollTo({ top: 0, behavior: "instant" });
        $("#main").focus({ preventScroll: true });
      }
      function renderFlow() {
        render();
        const flow = $(".flow");
        if (flow) {
          flow.scrollIntoView({ block: "start", behavior: "instant" });
          const title = flow.querySelector(".count-title h3, h2");
          if (title) {
            title.tabIndex = -1;
            title.focus({ preventScroll: true });
          }
        }
      }
      function toast(message) {
        clearTimeout(toastTimer);
        $("#toast").innerHTML =
          `<div class="toast">${icon("check")}<span>${esc(message)}</span><button type="button" data-dismiss-toast aria-label="Dismiss notification">Close</button></div>`;
        toastTimer = setTimeout(() => ($("#toast").innerHTML = ""), 6000);
      }
      let movementSequence = 0;
      function addMovement(kind, summary, changes, extra = {}) {
        const m = {
          handle: "demo-" + Date.now() + "-" + ++movementSequence,
          at: new Date().toISOString(),
          kind,
          summary,
          changes,
          sku: "",
          qty: 0,
          who: "",
          skipped: [],
          value: 0,
          recorded_by: "Marko",
          undoes: "",
          ...extra,
        };
        movements.unshift(m);
        return m;
      }
      function applyChanges(changes) {
        for (const c of changes) {
          const p = byCode(c.code);
          if (c.to !== undefined) p.on_hand = c.to;
          else p.on_hand += c.delta;
          if (c.water_delta) p.on_water += c.water_delta;
        }
      }
      function validQuantity(value, unit, zero = false) {
        return (
          String(value).trim() !== "" &&
          Number.isFinite(Number(value)) &&
          Number(value) >= (zero ? 0 : unit === "L" ? 0.1 : 1) &&
          (unit === "L" || Number.isInteger(Number(value)))
        );
      }
      function checkCount() {
        const p = parts[countIndex],
          d = countDraft[p.code] || { garage: "", shed: "" };
        if (
          !validQuantity(d.garage, p.unit, true) ||
          !validQuantity(d.shed, p.unit, true)
        ) {
          $("#count-error").textContent =
            "Count both locations. Enter 0 if a location is empty.";
          return false;
        }
        return true;
      }
      function openUndo(handle) {
        const m = movements.find((m) => m.handle === handle);
        if (!m || !canUndo(m)) return;
        const changes = m.changes.map((c) => {
          const p = byCode(c.code);
          return c.to !== undefined
            ? { code: c.code, from: p.on_hand, to: c.from }
            : {
                code: c.code,
                delta: -c.delta,
                ...(c.water_delta ? { water_delta: -c.water_delta } : {}),
              };
        });
        const invalid = changes.some((c) => {
            const p = byCode(c.code);
            return (
              (c.to ?? p.on_hand + c.delta) < 0 ||
              p.on_water + (c.water_delta || 0) < 0
            );
          }),
          stale =
            m.kind === "count" &&
            m.changes.some((c) => byCode(c.code).on_hand !== c.to);
        $("#modal-content").innerHTML =
          `<h2 id="modal-title">${m.kind === "count" ? "Undo this stocktake?" : "Reverse this change?"}</h2><p>${esc(m.summary)}. This adds a new history entry.</p>${stale ? '<div class="flow-alert warning" style="margin-top:14px">Stock has changed since this count. Undo would restore the earlier count; check these numbers carefully.</div>' : ""}<div class="changes"><h3>On hand · now → after undo</h3>${changes.map((c) => `<div class="change"><span>${esc(byCode(c.code).name)}</span><b>${fmt(byCode(c.code).on_hand)} → ${fmt(c.to ?? byCode(c.code).on_hand + c.delta)}</b></div>${c.water_delta ? `<div class="change"><span>On the way</span><b>${fmt(byCode(c.code).on_water)} → ${fmt(byCode(c.code).on_water + c.water_delta)}</b></div>` : ""}`).join("")}</div>${invalid ? '<div class="flow-alert error">Stock has changed since this entry. This undo would take a count below zero. Count the part again instead.</div>' : ""}<div class="row between"><button class="btn" data-close-modal>Cancel</button><button class="btn primary" data-confirm-undo="${esc(handle)}" ${invalid ? "disabled" : ""}>Confirm undo</button></div>`;
        $("#modal").showModal();
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b || b.disabled) return;
        if (b.dataset.page) {
          go(b.dataset.page);
          return;
        }
        if (b.dataset.flow) {
          action = b.dataset.flow;
          go("actions");
          return;
        }
        if (b.dataset.partFocus) {
          partSearch = byCode(b.dataset.partFocus).name;
          partFilter = "all";
          go("parts");
          return;
        }
        if (b.dataset.stock) {
          stockView = b.dataset.stock;
          render();
          return;
        }
        if (b.dataset.recipe) {
          const box = document.getElementById(b.getAttribute("aria-controls")),
            open = b.getAttribute("aria-expanded") === "true";
          box.hidden = open;
          b.setAttribute("aria-expanded", String(!open));
          return;
        }
        if (b.dataset.partFilter) {
          partFilter = b.dataset.partFilter;
          render();
          return;
        }
        if (b.dataset.receive) {
          receiveCode = b.dataset.receive;
          receiveQty = byCode(receiveCode).on_water || 1;
          action = "receive";
          go("actions");
          return;
        }
        if (b.dataset.action) {
          action = b.dataset.action;
          renderFlow();
          return;
        }
        if (b.dataset.step) {
          const input = document.getElementById(b.dataset.step),
            step = Number(b.dataset.amount),
            val = Math.max(Number(input.min), Number(input.value || 0) + step);
          input.value = String(Math.round(val * 10) / 10);
          input.dispatchEvent(new Event("input", { bubbles: true }));
          return;
        }
        if (b.hasAttribute("data-count-next")) {
          if (!checkCount()) return;
          if (countIndex === parts.length - 1) countReview = true;
          else countIndex++;
          renderFlow();
          return;
        }
        if (b.hasAttribute("data-count-skip")) {
          if (countIndex === parts.length - 1) countReview = true;
          else countIndex++;
          renderFlow();
          return;
        }
        if (b.hasAttribute("data-count-prev")) {
          countIndex = Math.max(0, countIndex - 1);
          renderFlow();
          return;
        }
        if (b.hasAttribute("data-count-review")) {
          countReview = true;
          renderFlow();
          return;
        }
        if (b.hasAttribute("data-count-back")) {
          countReview = false;
          renderFlow();
          return;
        }
        if (b.hasAttribute("data-save-count")) {
          const changes = countChanges();
          if (!changes.length) return;
          applyChanges(changes);
          addMovement(
            "count",
            `${changes.length} part${changes.length === 1 ? "" : "s"} counted`,
            changes,
            { qty: changes.length, who: "Garage + shed" },
          );
          countDraft = {};
          countIndex = 0;
          countReview = false;
          render();
          toast("Counts saved in this demo. Shopify is unchanged.");
          return;
        }
        if (b.dataset.why) {
          outWhy = b.dataset.why;
          render();
          return;
        }
        if (b.hasAttribute("data-save-out")) {
          const plan = outPlan();
          if (!plan.valid || plan.over.length) return;
          const ref = outWho.trim().toLowerCase();
          if (outWhy === "order" && !ref) {
            $("#out-error").textContent =
              "Add the order number so you can find it later.";
            return;
          }
          if (
            outWhy === "order" &&
            movements.some(
              (m) => m.kind === "order" && m.who.toLowerCase() === ref,
            )
          ) {
            $("#out-error").textContent =
              "That order is already in History. Check it before taking stock out again.";
            return;
          }
          applyChanges(plan.changes);
          addMovement(
            outWhy,
            `${plan.q} ${plan.p.short_name}${plan.q > 1 ? "s" : ""} taken out`,
            plan.changes,
            {
              sku: outSku,
              qty: plan.q,
              who: outWho.trim(),
              value: plan.changes.reduce(
                (s, c) => s - c.delta * byCode(c.code).unit_cost,
                0,
              ),
            },
          );
          outQty = 1;
          outWho = "";
          render();
          toast(
            "Stock taken out in this demo. You can put it back in History.",
          );
          return;
        }
        if (b.hasAttribute("data-save-receive")) {
          const p = byCode(receiveCode),
            q = Number(receiveQty);
          if (!validQuantity(receiveQty, p.unit)) {
            $("#receive-error").textContent =
              p.unit === "L"
                ? "Enter a delivery quantity of at least 0.1 L."
                : "Enter a whole number of at least 1.";
            return;
          }
          const changes = [
            { code: p.code, delta: q, water_delta: -Math.min(p.on_water, q) },
          ];
          applyChanges(changes);
          addMovement(
            "receive",
            `${fmt(q)} ${p.name.toLowerCase()} received`,
            changes,
            { qty: q, who: receiveNote.trim() || "Delivery received" },
          );
          receiveNote = "";
          receiveQty = 1;
          render();
          toast("Delivery added in this demo. The build board has updated.");
          return;
        }
        if (b.dataset.undo) {
          openUndo(b.dataset.undo);
          return;
        }
        if (b.dataset.confirmUndo) {
          const m = movements.find((m) => m.handle === b.dataset.confirmUndo);
          if (!m || !canUndo(m)) return;
          const changes = m.changes.map((c) =>
            c.to !== undefined
              ? { code: c.code, from: byCode(c.code).on_hand, to: c.from }
              : {
                  code: c.code,
                  delta: -c.delta,
                  ...(c.water_delta ? { water_delta: -c.water_delta } : {}),
                },
          );
          if (
            changes.some(
              (c) =>
                (c.to ?? byCode(c.code).on_hand + c.delta) < 0 ||
                byCode(c.code).on_water + (c.water_delta || 0) < 0,
            )
          )
            return;
          applyChanges(changes);
          addMovement("putback", "Undid: " + m.summary, changes, {
            undoes: m.handle,
            sku: m.sku,
            qty: m.qty,
            who: "Reversed by Marko",
          });
          $("#modal").close();
          render();
          toast("Change undone in this demo. History keeps both entries.");
          return;
        }
        if (b.hasAttribute("data-close-modal")) {
          $("#modal").close();
          return;
        }
        if (b.hasAttribute("data-dismiss-toast")) {
          $("#toast").innerHTML = "";
          return;
        }
        if (b.id === "reset") {
          $("#modal-content").innerHTML =
            '<h2 id="modal-title">Reset the demo?</h2><p>This clears your demo changes and stocktake drafts, and restores the sample numbers.</p><div class="row between"><button class="btn" data-close-modal>Keep changes</button><button class="btn primary" data-confirm-reset>Reset demo</button></div>';
          $("#modal").showModal();
          return;
        }
        if (b.hasAttribute("data-confirm-reset")) {
          const initial = JSON.parse(INITIAL);
          parts = initial.parts;
          movements = initial.movements;
          countDraft = {};
          countIndex = 0;
          countReview = false;
          outQty = 1;
          outWho = "";
          outWhy = "order";
          receiveCode = "HANDLE";
          receiveQty = 300;
          receiveNote = "";
          stockView = "now";
          partSearch = "";
          historySearch = "";
          partFilter = "all";
          historyKind = "all";
          $("#modal").close();
          render();
          toast("Back to the original sample data.");
        }
      });
      document.addEventListener("input", (e) => {
        const el = e.target;
        if (el.id === "parts-search") {
          partSearch = el.value;
          $("#parts-results").innerHTML = partsResults();
        }
        if (el.id === "history-search") {
          historySearch = el.value;
          $("#history-results").innerHTML = historyResults();
        }
        if (el.id === "count-garage" || el.id === "count-shed") {
          const p = parts[countIndex],
            loc = el.id.slice(6);
          countDraft[p.code] ??= { garage: "", shed: "" };
          countDraft[p.code][loc] = el.value;
          const d = countDraft[p.code];
          $("#count-total").textContent =
            d.garage !== "" && d.shed !== ""
              ? fmt(Number(d.garage) + Number(d.shed))
              : "—";
          $("#count-error").textContent = "";
        }
        if (el.id === "out-qty") {
          outQty = el.value;
          $("#out-preview").innerHTML = outPreview();
          const plan = outPlan();
          $("#save-out").disabled = !plan.valid || plan.over.length > 0;
          $("#save-out").innerHTML =
            `${icon("out")}Take ${plan.valid ? plan.q : 0} out of stock`;
        }
        if (el.id === "out-who") outWho = el.value;
        if (el.id === "receive-qty") {
          receiveQty = el.value;
          $("#receive-preview").innerHTML = receivePreview();
        }
        if (el.id === "receive-note") receiveNote = el.value;
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "out-sku") {
          outSku = e.target.value;
          render();
        }
        if (e.target.id === "receive-code") {
          receiveCode = e.target.value;
          receiveQty = byCode(receiveCode).on_water || 1;
          render();
        }
        if (e.target.id === "history-kind") {
          historyKind = e.target.value;
          $("#history-results").innerHTML = historyResults();
        }
      });
      $("#modal").addEventListener("click", (e) => {
        if (e.target === $("#modal")) $("#modal").close();
      });
      render();
    </script>
  </body>
</html>
