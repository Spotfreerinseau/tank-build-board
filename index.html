<style id="css">

 :root:not([data-theme="light"]){

 }

.tag.faulty{background:var(--crit-bg);color:var(--crit)}

  font:700 12px/1 Urbanist,sans-serif;padding:7px 10px;margin-left:auto;cursor:pointer;white-space:nowrap}
.status span.t{flex:1 1 auto;min-width:0}

<body>
<div id="top"></div>
<div class="wrap"><div id="app"></div></div>
<div id="savebar"></div>
<script id="appjs">
/* Tank Build Board, Shopify admin app. Everything on this page lives in Shopify as metaobjects
   (Content > Metaobjects in the Shopify admin):
     tank_board_part      one per part: code, name, on_hand, on_water, on_hold, unit_cost, note
     tank_board_product   one per product SKU: parts (the recipe), monthly_sales
     tank_board_movement  every change: stock out, put back, count, Shopify order sync
     tank_board_settings  "main": sales window and the order sync position
   The page runs inside the Shopify admin and reads and writes them through
   App Bridge's Direct API access, so the bots and this page always see the
   same numbers. There is no server behind it.                                 */

var SERVER = "Shopify";
var BY = "Tank Build Board";
var READ = 'query Board { ' +
  'parts: metaobjects(type:"tank_board_part", first:250){ nodes{ id handle fields{ key value } } } ' +
  'products: metaobjects(type:"tank_board_product", first:100){ nodes{ id handle fields{ key value } } } ' +
  'moves: metaobjects(type:"tank_board_movement", first:250, sortKey:"updated_at", reverse:true){ nodes{ id handle fields{ key value } } } ' +
  'settings: metaobjectByHandle(handle:{type:"tank_board_settings", handle:"main"}){ id fields{ key value } } }';

var DATA = { components:[], recipes:{}, rate:{}, window:"", sync:null };
var byCode = {}, NAMES = {}, SKUS = [], server = {}, counts = {}, moves = [], undone = {};
var mcp = null, phase = "loading", loadErr = null, loadedAt = null, busy = false, retried = false;
var mode = "build", view = "now", filter = "todo", opened = {};
var outSku = "SFR-TANK-10L", outQty = "1", outWhy = "order", outWho = "", outMsg = "", outErr = "", note = "", noteBad = false;
var WHY = { order:"Order", gift:"Gift", sample:"Sample", faulty:"Faulty or damaged", own:"Used in the business" };

/* Count drafts: numbers typed on the Count tab but not saved yet. Kept on this
   device only, so a half-finished stocktake survives a reload.               */
var DKEY = "sfr-board-count-drafts-v2";
var drafts = {};
try { drafts = JSON.parse(localStorage.getItem(DKEY) || "{}") || {}; } catch (e) { drafts = {}; }
function keepDrafts(){
  try {
    if (Object.keys(drafts).length) localStorage.setItem(DKEY, JSON.stringify(drafts));
    else localStorage.removeItem(DKEY);
  } catch (e) {}
}

/* ---------------- reading Shopify ---------------- */
function fmap(node){ var o = {}; ((node && node.fields) || []).forEach(function(f){ o[f.key] = f.value; }); return o; }
function num(v){ if (v === null || v === undefined || v === "") return null; var n = Number(v); return isFinite(n) ? n : null; }
function pj(v, d){ if (v === null || v === undefined || v === "") return d; try { return JSON.parse(v); } catch (e) { return d; } }
function own(o, k){ return Object.prototype.hasOwnProperty.call(o, k); }

function payloadOf(res){
  var p = res && res.payload;
  if (typeof p === "string"){
    try { p = JSON.parse(p); } catch (e) { throw { code:"tool_error", message:p.slice(0, 200) }; }
  }
  if (p && typeof p.result === "string"){ try { p = JSON.parse(p.result); } catch (e) {} }
  if (!p || typeof p !== "object") throw { code:"upstream_error", message:"Shopify sent back nothing readable" };
  if (p.errors && p.errors.length){
    throw { code:"tool_error", message:p.errors.map(function(e){ return (e && e.message) || String(e); }).join("; ") };
  }
  return p.data || p;
}

function apply(d){
  var comps = (((d.parts || {}).nodes) || []).map(function(n){
    var f = fmap(n);
    return { id:n.id, code:f.code, name:f.name || f.code, unit:f.unit || "each", supplier:f.supplier || "",
             lead:num(f.lead_days) || 0, onHand:num(f.on_hand), onWater:num(f.on_water) || 0,
             hold:num(f.on_hold) || 0, cost:num(f.unit_cost) || 0, note:f.note || "",
             sort:num(f.sort) === null ? 999 : num(f.sort) };
  }).filter(function(c){ return c.code; });
  comps.sort(function(a, b){ return a.sort - b.sort; });
  var bc = {};
  comps.forEach(function(c){ bc[c.code] = c; });

  var prods = (((d.products || {}).nodes) || []).map(function(n){
    var f = fmap(n), parts = pj(f.parts, []);
    return { sku:f.sku, name:f.name || f.sku, short:f.short_name || f.name || f.sku,
             parts:Array.isArray(parts) ? parts : [], rate:num(f.monthly_sales) || 0,
             sort:num(f.sort) === null ? 999 : num(f.sort) };
  }).filter(function(p){ return p.sku; });
  prods.sort(function(a, b){ return a.sort - b.sort; });
  var recipes = {}, rate = {}, names = {};
  prods.forEach(function(p){
    recipes[p.sku] = { name:p.name, items:p.parts.filter(function(it){
      return it && bc[it.code] && Number(it.qty) > 0;
    }).map(function(it){ return { code:it.code, qty:Number(it.qty) }; }) };
    rate[p.sku] = p.rate;
    names[p.sku] = p.short;
  });

  var st = d.settings ? fmap(d.settings) : {};
  DATA = { components:comps, recipes:recipes, rate:rate, window:st.sales_window || "", sync:pj(st.sync, null) };
  byCode = bc; NAMES = names; SKUS = prods.map(function(p){ return p.sku; });
  server = {};
  comps.forEach(function(c){ server[c.code] = c.onHand; });

  var mv = (((d.moves || {}).nodes) || []).map(function(n){
    var f = fmap(n), ch = pj(f.changes, []), sk = pj(f.skipped, []);
    return { id:n.id, handle:n.handle, at:f.at || "", sku:f.sku || "", qty:num(f.qty) || 0, why:f.kind || "",
             who:f.who || "", changes:Array.isArray(ch) ? ch : [], skip:Array.isArray(sk) ? sk : [],
             value:num(f.value) || 0, by:f.recorded_by || "", undoes:f.undoes || "", summary:f.summary || "" };
  });
  mv.sort(function(a, b){ var x = Date.parse(a.at) || 0, y = Date.parse(b.at) || 0; return y - x; });
  moves = mv;
  undone = {};
  mv.forEach(function(m){ if (m.undoes) undone[m.undoes] = m; });

  Object.keys(drafts).forEach(function(k){ if (!bc[k] || drafts[k] === server[k]) delete drafts[k]; });
  keepDrafts();
  recount();
  if (!recipes[outSku] && SKUS.length) outSku = SKUS[0];
}
function recount(){
  counts = {};
  DATA.components.forEach(function(c){ counts[c.code] = own(drafts, c.code) ? drafts[c.code] : server[c.code]; });
}

function fetchBoard(){
  return mcp.callTool(SERVER, "graphql_query", { query:READ }, { cache:false })
    .then(payloadOf)
    .then(function(d){
      if (!d.parts) throw { code:"tool_error", message:"the board's parts aren't in Shopify" };
      apply(d);
      loadedAt = new Date(); phase = "ready"; loadErr = null; retried = false;
    });
}
function load(){
  if (!mcp) return Promise.resolve();
  return fetchBoard().then(render, function(err){
    err = err || {};
    if (err.retryable && !retried){
      retried = true;
      var wait = Math.min(err.retryAfterMs || 0, 60000) || (1500 + Math.random() * 2000);
      return new Promise(function(r){ setTimeout(r, wait); }).then(load);
    }
    loadErr = err;
    if (phase !== "ready") phase = "error";
    render();
  });
}

function errText(e){
  var c = (e && e.code) || "";
  if (c === "needs_reauth") return "Shopify needs you to sign in again. Reload the page.";
  if (c === "forbidden") return "The app isn't allowed to read the board. It needs the metaobjects permission approved in Shopify.";
  if (c === "server_unavailable") return "Shopify didn't answer just now. Try again in a minute.";
  if (c === "tool_error") return "Shopify said: " + ((e && e.message) || "something went wrong") + ".";
  if (c === "cancelled") return "That was cancelled.";
  return "Couldn't reach Shopify" + (e && e.message ? ": " + e.message : "") + ".";
}
function writeErrText(e){
  var c = (e && e.code) || "";
  if (c === "server_unavailable" || c === "upstream_error" || !c)
    return "Shopify didn't confirm that one. The board has reloaded, so check the list below before you try again.";
  return errText(e);
}

/* ---------------- writing Shopify ---------------- */
function F(key, value){ return { key:key, value:String(value) }; }
function dec(n){ return String(Math.round(Number(n) * 10000) / 10000); }
function stamp(){ return new Date().toISOString().replace(/\D/g, "").slice(0, 14); }
function slug(s){ return (String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60)) || "x"; }

function mutate(ops){
  var decl = [], sel = [], vars = {};
  ops.forEach(function(op, i){
    if (op.handle){
      decl.push("$h" + i + ": MetaobjectHandleInput!", "$m" + i + ": MetaobjectUpsertInput!");
      sel.push("u" + i + ": metaobjectUpsert(handle: $h" + i + ", metaobject: $m" + i + ") { metaobject { handle } userErrors { field message code } }");
      vars["h" + i] = op.handle;
    } else {
      decl.push("$id" + i + ": ID!", "$m" + i + ": MetaobjectUpdateInput!");
      sel.push("u" + i + ": metaobjectUpdate(id: $id" + i + ", metaobject: $m" + i + ") { metaobject { handle } userErrors { field message code } }");
      vars["id" + i] = op.id;
    }
    vars["m" + i] = { fields:op.fields };
  });
  var q = "mutation Board(" + decl.join(", ") + ") { " + sel.join(" ") + " }";
  return mcp.callTool(SERVER, "graphql_mutation", { query:q, variables:vars })
    .then(payloadOf)
    .then(function(d){
      var errs = [];
      ops.forEach(function(op, i){
        var r = d["u" + i];
        if (r && r.userErrors && r.userErrors.length) r.userErrors.forEach(function(e){ errs.push(e.message); });
        else if (!r || !r.metaobject) errs.push("one of the changes didn't stick");
      });
      if (errs.length) throw { code:"tool_error", message:errs.join("; ") };

    });
}
function movement(handle, f){
  var fields = [];
  Object.keys(f).forEach(function(k){
    if (f[k] === null || f[k] === undefined || f[k] === "") return;
    fields.push(F(k, f[k]));
  });
  return { handle:{ type:"tank_board_movement", handle:handle }, fields:fields };
}

/* ---------------- maths ---------------- */
function has(code){ var v = counts[code]; return !(v === null || v === undefined || v === ""); }
function avail(code){
  var c = byCode[code], base = has(code) ? Number(counts[code]) : 0;
  return view === "now" ? base : base + (c.onWater || 0);
}
function shortName(n){ return String(n).split(/[,—(]/)[0].trim(); }
function nm(sku){ return NAMES[sku] || sku; }

/* Products are not independent. The TDS meters, the resin, the valve heads,
   the handles, the hoses and the fittings are all shared, so taking each
   product's maximum on its own promises the same part to several products at
   once. Instead: share out what you hold in the proportions you actually sell,
   one unit at a time, and let each product stop when something of its own runs
   out. Products with no sales in the window cannot be given a share, so they
   show their standalone maximum and say so.                                    */
function known(code){
  var c = byCode[code];
  return has(code) || (view === "after" && (c.onWater || 0) > 0);
}
function allocate(){
  var pool = {}, out = {};
  DATA.components.forEach(function(c){ pool[c.code] = known(c.code) ? avail(c.code) : Infinity; });

  SKUS.forEach(function(sku){
    var unknown = DATA.recipes[sku].items.filter(function(it){ return !known(it.code); })
                     .map(function(it){ return byCode[it.code]; });
    out[sku] = { sku:sku, name:nm(sku),
                 full:DATA.recipes[sku].name.replace(" (not online yet)",""),
                 items:DATA.recipes[sku].items, rate:DATA.rate[sku] || 0,
                 unknown:unknown, n:0, who:null, shared:false, inMix:(DATA.rate[sku] || 0) > 0 };
  });

  var mix = SKUS.filter(function(s){ return out[s].inMix && DATA.recipes[s].items.length; });
  var total = mix.reduce(function(a, s){ return a + out[s].rate; }, 0);
  var blockedBy = {}, guard = 0;

  function firstShort(sku){
    var items = DATA.recipes[sku].items;
    for (var i = 0; i < items.length; i++){ if (pool[items[i].code] < items[i].qty) return items[i].code; }
    return null;
  }
  while (guard++ < 20000){
    var live = mix.filter(function(s){ return !blockedBy[s]; });
    if (!live.length) break;
    var pick = null, behind = Infinity;
    live.forEach(function(s){
      var d = out[s].n / (out[s].rate / total);
      if (d < behind){ behind = d; pick = s; }
    });
    var short = firstShort(pick);
    if (short){ blockedBy[pick] = short; continue; }
    DATA.recipes[pick].items.forEach(function(it){ pool[it.code] -= it.qty; });
    out[pick].n++;
  }
  mix.forEach(function(s){
    var code = blockedBy[s];
    out[s].who = code ? byCode[code] : null;
    if (code){
      var users = SKUS.filter(function(o){
        return out[o].inMix && DATA.recipes[o].items.some(function(it){ return it.code === code; });
      });
      out[s].shared = users.length > 1;
      out[s].sharedWith = users.filter(function(o){ return o !== s; }).map(function(o){ return out[o].name; });
    }
  });

  /* products with no sales rate get no share, so show a standalone maximum
     from what is left after the mix has been served                            */
  SKUS.filter(function(s){ return mix.indexOf(s) < 0; }).forEach(function(sku){
    var n = Infinity, who = null;
    DATA.recipes[sku].items.forEach(function(it){
      var a = pool[it.code];
      if (a === Infinity) return;
      var k = Math.floor(a / it.qty);
      if (k < n){ n = k; who = byCode[it.code]; }
    });
    out[sku].n = n === Infinity ? null : n;
    out[sku].who = who;
    out[sku].inMix = false;
  });

  SKUS.forEach(function(sku){
    var m = out[sku];
    if (m.n !== null && m.unknown.length === m.items.length) m.n = null;
    m.weeks = (m.n !== null && m.rate > 0) ? (m.n / m.rate) * 4.33 : null;
    m.sev = m.n === null ? "unknown"
          : !m.inMix ? "unknown"
          : m.weeks < 6 ? "crit" : m.weeks < 12 ? "warn" : "ok";
  });
  return { out:out, pool:pool };
}
function order(m){
  if (!m.inMix) return 4;                 // no sales in the window, park it at the bottom
  if (m.sev === "crit") return 0;
  if (m.sev === "warn") return 1;
  if (m.n === null) return 2;             // genuinely cannot tell, worth a look
  return 3;
}
function board(){
  var a = allocate();
  return SKUS.map(function(s){ return a.out[s]; }).sort(function(x, y){
    return (order(x) - order(y)) || ((x.weeks === null ? 1e9 : x.weeks) - (y.weeks === null ? 1e9 : y.weeks));
  });
}
function qty(m){ return m.n === null ? "?" : m.n.toLocaleString(); }
function wshort(m){ return m.weeks === null ? "" : (m.weeks < 1 ? "<1w" : Math.round(m.weeks) + "w"); }
function wlong(m){
  if (m.n === null) return "never counted";
  if (m.weeks === null) return "no sales rate yet";
  return (m.weeks < 1 ? "under a week" : Math.round(m.weeks) + " weeks") + " of cover at " + m.rate + " a month";
}
function plural(n, word){ return n + " " + word + (n === 1 ? "" : "s"); }
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function money(n){
  return "$" + Number(n).toLocaleString("en-AU", { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function flagged(c){ return /QUERY|CONFIRM|VERIFY|short of/i.test(c.note || ""); }
function todo(){ return DATA.components.filter(function(c){ return !has(c.code); }); }
function clock(d){ return d.toLocaleTimeString("en-AU", { hour:"numeric", minute:"2-digit" }).replace(/\s/g, "").toLowerCase(); }
function day(d){ return d.toLocaleDateString("en-AU", { day:"numeric", month:"short" }); }

/* ---------------- taking stock out ----------------
   One place for anything that leaves the shed: an order you fulfilled, a unit
   gifted to an influencer, a sample, or something you broke. Pick the product,
   say how many, and every part in its recipe comes off the count at once.     */
function unitCost(sku){
  var r = DATA.recipes[sku];
  return r ? r.items.reduce(function(a, it){
    var c = byCode[it.code]; return a + (c ? (c.cost || 0) * it.qty : 0);
  }, 0) : 0;
}
function outPlan(){
  var q = Math.max(0, Math.floor(Number(outQty) || 0));
  var r = DATA.recipes[outSku] || { items:[] };
  var lines = r.items.map(function(it){
    var c = byCode[it.code], need = it.qty * q, have = has(it.code) ? Number(counts[it.code]) : null;
    return { code:it.code, name:shortName(c.name), unit:c.unit, need:need, have:have,
             after:have === null ? null : have - need, skip:have === null };
  });
  return { q:q, lines:lines,
           skip:lines.filter(function(l){ return l.skip; }),
           over:lines.filter(function(l){ return l.after !== null && l.after < 0; }) };
}
function takeOut(){
  if (busy || !mcp) return;
  var q = Math.max(0, Math.floor(Number(outQty) || 0));
  if (!q) return;
  var sku = outSku, why = outWhy, who = outWho.trim();
  busy = true; outMsg = ""; outErr = ""; render();
  fetchBoard().then(function(){
    var r = DATA.recipes[sku];
    if (!r) throw { code:"tool_error", message:"that product isn't on the board any more" };
    var need = {}, changes = [], skip = [], ops = [];
    r.items.forEach(function(it){ need[it.code] = (need[it.code] || 0) + it.qty * q; });
    Object.keys(need).forEach(function(code){
      var have = server[code];
      if (have === null || have === undefined){ skip.push(code); return; }
      var after = Math.max(0, have - need[code]);
      if (after === have) return;
      changes.push({ code:code, delta:after - have });
      ops.push({ id:byCode[code].id, fields:[F("on_hand", dec(after))] });
    });
    ops.unshift(movement("m-" + stamp() + "-" + slug(sku), {
      summary:q + " " + nm(sku) + " out (" + why + ")", at:new Date().toISOString(), kind:why, sku:sku, qty:q,
      who:who, changes:JSON.stringify(changes), skipped:JSON.stringify(skip),
      value:dec(Math.round(unitCost(sku) * q * 100) / 100), recorded_by:BY }));
    return mutate(ops).then(function(){
      changes.forEach(function(c){
        if (own(drafts, c.code) && drafts[c.code] !== null) drafts[c.code] = Math.max(0, drafts[c.code] + c.delta);
      });
      keepDrafts();
      outMsg = q + " " + nm(sku) + " taken out and saved to Shopify.";
      outQty = "1"; outWho = "";
    });
  }).catch(function(err){ outErr = writeErrText(err); })
    .then(function(){ busy = false; return load(); });
}
function putBack(handle){
  if (busy || !mcp) return;
  busy = true; outMsg = ""; outErr = ""; render();
  fetchBoard().then(function(){
    var m = null;
    moves.forEach(function(x){ if (x.handle === handle) m = x; });
    if (!m) throw { code:"tool_error", message:"that movement isn't there any more" };
    if (undone[handle]) throw { code:"tool_error", message:"that one is already back on the shelf" };
    var ops = [], changes = [];
    m.changes.forEach(function(c){
      var p = byCode[c.code], dl = Number(c.delta);
      if (!p || !dl) return;
      var have = server[c.code], base = (have === null || have === undefined) ? 0 : have;
      var after = Math.max(0, base - dl);
      if (after === base) return;
      changes.push({ code:c.code, delta:after - base });
      ops.push({ id:p.id, fields:[F("on_hand", dec(after))] });
    });
    ops.unshift(movement("m-" + stamp() + "-putback-" + slug(m.sku), {
      summary:m.qty + " " + nm(m.sku) + " put back", at:new Date().toISOString(), kind:"putback", sku:m.sku, qty:m.qty,
      who:"Undid: " + (m.summary || (m.qty + " " + nm(m.sku))) + (m.who ? ", " + m.who : ""),
      changes:JSON.stringify(changes), skipped:"[]", value:dec(m.value || 0), recorded_by:BY, undoes:handle }));
    return mutate(ops).then(function(){
      changes.forEach(function(c){
        if (own(drafts, c.code) && drafts[c.code] !== null) drafts[c.code] = Math.max(0, drafts[c.code] + c.delta);
      });
      keepDrafts();
      outMsg = "Put back on the shelf and saved to Shopify.";
    });
  }).catch(function(err){ outErr = writeErrText(err); })
    .then(function(){ busy = false; return load(); });
}

        '<span class="tag' + cls + '">' + esc(kindLabel(k)) + '</span></b><i>' + meta + '</i>' +
        ((k === "count" || k === "putback") && e.changes.length ? '<i class="ch">' + esc(changeText(e)) + '</i>' : '') +
        '</span>' +
        (canUndo ? '<button type="button" class="undo" data-undo="' + esc(e.handle) + '"' + (busy ? " disabled" : "") + '>Put back</button>' : '') +
        '</div>';
    }).join("") + '</div>';
  }

  var gifts = moves.filter(function(e){ return e.why === "gift" && !undone[e.handle]; });
  if (gifts.length){
    var gv = gifts.reduce(function(a, e){ return a + (e.value || 0); }, 0);
    html += '<p class="foot"><b>Gifts and freebies.</b> ' + plural(gifts.length, "giveaway") + ' recorded so far, ' +
      money(gv) + ' of stock valued at what it cost to land it. Worth handing to your accountant at year end.</p>';
  }
  html += '<p class="foot"><b>What this does.</b> Taking one unit out here removes every part in that product in one go and saves it to Shopify straight away, ' +
    'so the build numbers stay honest without you counting the shed again. Parts you have never counted are left alone rather than pushed negative. ' +
    'Put back undoes the whole movement and keeps a record that it was put back. Shipped Shopify orders come off by themselves each morning.</p>';
  return html;
}

function renderCount(){
  var all = DATA.components, left = todo(), flags = all.filter(flagged);
  var pool = filter === "todo" ? left : (filter === "flag" ? flags : all);
  var done = all.length - left.length, pct = all.length ? Math.round(done / all.length * 100) : 0;
  var html =
    '<div class="prog"><span>' + done + ' of ' + all.length + ' counted</span>' +
    '<span class="track"><i style="width:' + pct + '%"></i></span><span class="num">' + pct + '%</span></div>' +
    '<div class="chips" role="group" aria-label="Which parts">' +
    '<button type="button" data-f="todo" aria-pressed="' + (filter === "todo") + '">Still to count (' + left.length + ')</button>' +
    '<button type="button" data-f="flag" aria-pressed="' + (filter === "flag") + '">Check these (' + flags.length + ')</button>' +
    '<button type="button" data-f="all" aria-pressed="' + (filter === "all") + '">Everything (' + all.length + ')</button></div>';
  html += pool.length
    ? '<div class="list">' + pool.map(function(c){
        var v = has(c.code) ? counts[c.code] : "";
        return '<div class="crow"><span class="nm"><b>' + esc(shortName(c.name)) + '</b><i>' + esc(c.code) + ' · ' + esc(c.supplier) + '</i>' +
          (c.hold ? '<u>' + c.hold.toLocaleString() + ' on hold, not saleable</u>' : '') +
          ((filter === "flag" && c.note) ? '<em>' + esc(c.note) + '</em>' : '') + '</span>' +
          '<input type="number" min="0" step="any" inputmode="decimal" data-code="' + esc(c.code) + '" value="' + esc(v) + '" placeholder="count" aria-label="Count of ' + esc(shortName(c.name)) + '">' +
          '<span class="un">' + esc(c.unit) + '</span></div>';
      }).join("") + '</div>'
    : '<div class="list"><div class="crow"><span class="nm"><b>Nothing here. Every part in this list is counted.</b></span></div></div>';
  html += '<p class="foot"><b>Counting.</b> Type what is physically in the shed. Resin goes in litres, everything else in units. What you type is kept on this device until you press save, then it goes into Shopify for every device and the bots, with a record of what changed.</p>';
  return html;
}

function renderProgress(){
  var all = DATA.components, left = todo().length, done = all.length - left, pct = all.length ? Math.round(done / all.length * 100) : 0;
  var p = document.querySelector(".prog");
  if (p) p.innerHTML = '<span>' + done + ' of ' + all.length + ' counted</span>' +
    '<span class="track"><i style="width:' + pct + '%"></i></span><span class="num">' + pct + '%</span>';
  var chip = document.querySelector('[data-f="todo"]');
  if (chip) chip.textContent = "Still to count (" + left + ")";
}

function renderSave(){
  var host = document.getElementById("savebar"), n = phase === "ready" ? Object.keys(drafts).length : 0;
  if (!n && !note){ host.innerHTML = ""; return; }
  var line = busy && n ? "Saving to Shopify" : (n ? plural(n, "count") + " not saved yet" : note);
  host.innerHTML = '<div class="in"><span class="msg"><b' + (noteBad && !n ? ' style="color:var(--crit)"' : '') + '>' + esc(line) + '</b>' +
    (n && !busy ? "Kept on this device. Press save to put them in Shopify." : "") + '</span>' +
    (n ? '<button type="button" id="saveBtn"' + (busy ? " disabled" : "") + '>' + (busy ? "Saving" : "Save") + '</button>' : '') + '</div>';
  var b = document.getElementById("saveBtn");
  if (b) b.addEventListener("click", saveCounts);
}

function saveCounts(){
  if (busy || !mcp || !Object.keys(drafts).length) return;
  busy = true; note = ""; noteBad = false; renderSave();
  var want = {};
  Object.keys(drafts).forEach(function(k){ want[k] = drafts[k]; });
  fetchBoard().then(function(){
    var ops = [], changes = [];
    Object.keys(want).forEach(function(code){
      var p = byCode[code];
      if (!p) return;
      var to = want[code], from = server[code];
      if (to === from) return;
      changes.push({ code:code, from:from, to:to });
      ops.push({ id:p.id, fields:[F("on_hand", to === null ? "" : dec(to))] });
    });
    if (!ops.length){ drafts = {}; keepDrafts(); note = "Nothing to save, Shopify already has those numbers"; return; }
    ops.unshift(movement("m-" + stamp() + "-count", {
      summary:"Count: " + plural(changes.length, "part") + " updated", at:new Date().toISOString(), kind:"count",
      qty:changes.length, changes:JSON.stringify(changes), recorded_by:BY }));
    return mutate(ops).then(function(){
      Object.keys(want).forEach(function(k){ if (drafts[k] === want[k]) delete drafts[k]; });
      keepDrafts();
      note = "Counts saved to Shopify";
      setTimeout(function(){ if (note === "Counts saved to Shopify"){ note = ""; renderSave(); } }, 5000);
    });
  }).catch(function(err){ note = writeErrText(err); noteBad = true; })
    .then(function(){ busy = false; return load(); });
}

function refresh(){
  if (busy || !mcp) return;
  if (phase !== "ready") phase = "loading";
  loadErr = null; retried = false; render();
  load();
}

function render(){
  renderTop();
  var app = document.getElementById("app");
  if (phase !== "ready"){
    app.innerHTML = renderGate();
    app.querySelectorAll("[data-refresh]").forEach(function(b){ b.addEventListener("click", refresh); });
    renderSave();
    return;
  }
  app.innerHTML = staleBanner() +
    (mode === "build" ? renderBuild() : (mode === "out" ? renderOut() : renderCount()));
  app.querySelectorAll("[data-view]").forEach(function(b){
    b.addEventListener("click", function(){ view = b.dataset.view; render(); });
  });
  app.querySelectorAll("[data-f]").forEach(function(b){
    b.addEventListener("click", function(){ filter = b.dataset.f; render(); });
  });
  app.querySelectorAll(".rhd").forEach(function(b){
    b.addEventListener("click", function(){
      var r = b.parentElement, sku = r.dataset.sku;
      opened[sku] = !opened[sku];
      r.dataset.open = opened[sku] ? "1" : "0";
    });
  });
  var selSku = document.getElementById("outSku");
  if (selSku) selSku.addEventListener("change", function(){ outSku = selSku.value; outMsg = ""; outErr = ""; renderPrev(); });
  var selWhy = document.getElementById("outWhy");
  if (selWhy) selWhy.addEventListener("change", function(){ outWhy = selWhy.value; });
  var inQty = document.getElementById("outQty");
  if (inQty) inQty.addEventListener("input", function(){ outQty = inQty.value; renderPrev(); });
  var inWho = document.getElementById("outWho");
  if (inWho) inWho.addEventListener("input", function(){ outWho = inWho.value; });
  var goBtn = document.getElementById("outGo");
  if (goBtn) goBtn.addEventListener("click", takeOut);
  app.querySelectorAll("[data-undo]").forEach(function(b){
    b.addEventListener("click", function(){ putBack(b.dataset.undo); });
  });
  if (mode === "out") renderPrev();
  app.querySelectorAll(".crow input").forEach(function(i){
    i.addEventListener("input", function(){
      var v = i.value.trim(), code = i.dataset.code;
      var val = v === "" ? null : Math.max(0, parseFloat(v) || 0);
      if (val === server[code]) delete drafts[code]; else drafts[code] = val;
      keepDrafts(); recount(); note = ""; noteBad = false;
      renderSave(); renderTop(); renderProgress();
    });
  });
  renderSave();
}

/* ---------------- start ---------------- */
/* Direct API access: App Bridge authenticates fetches to shopify:admin/...
   so the page talks to the GraphQL Admin API with no backend. The small shim
   below gives it the same call shape the rest of the page uses.              */
function shopifyGraphQL(input){
  return fetch("shopify:admin/api/graphql.json", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ query:input.query, variables:input.variables || {} })
  }).then(function(r){
    if (r.status === 401) throw { code:"needs_reauth", message:"signed out" };
    if (r.status === 403) throw { code:"forbidden", message:"not allowed" };
    if (r.status === 429 || r.status >= 500) throw { code:"server_unavailable", message:"Shopify returned " + r.status, retryable:true };
    if (!r.ok) throw { code:"upstream_error", message:"Shopify returned " + r.status };
    return r.json();
  }, function(e){
    throw { code:"server_unavailable", message:(e && e.message) || "network error", retryable:true };
  }).then(function(j){ return { payload:j }; });
}
render();
if (window.shopify){
  mcp = { callTool:function(server, tool, input){ return shopifyGraphQL(input); } };
  load();
} else {
  phase = "nomcp"; render();
}
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState !== "visible" || !mcp || busy || phase !== "ready") return;
  if (loadedAt && Date.now() - loadedAt.getTime() < 60000) return;
  var a = document.activeElement;
  if (a && a.tagName === "INPUT") return;
  load();
});
</script>
