<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="shopify-api-key" content="4f7b96b553a89adb05a3bf8e9df21c7e" />
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
    <title>Tank Build Board</title>
    <style>
      :root {
        --bg: #f3f3f1;
        --surface: #fff;
        --ink: #252724;
        --muted: #666c65;
        --line: #e6e7e3;
        --green: #176647;
        --green-bg: #e5f3eb;
        --red: #b83930;
        --red-bg: #fff0ed;
        --amber: #865b0c;
        --amber-bg: #fff4da;
        --blue: #416bad;
        --shadow: 0 1px 2px #19281c08, 0 3px 8px #19281c03;
        --radius: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button {
        color: inherit;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      a {
        color: var(--green);
      }
      button:focus-visible,
      a:focus-visible,
      summary:focus-visible {
        outline: 3px solid #528ce2;
        outline-offset: 3px;
      }
      input:focus,
      select:focus {
        outline: 2px solid #528ce2;
        outline-offset: 1px;
      }
      button svg {
        pointer-events: none;
      }
      svg {
        vertical-align: middle;
        flex-shrink: 0;
      }
      .icon {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .num {
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.025em;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
      .skip {
        position: fixed;
        top: -80px;
        left: 12px;
        background: white;
        padding: 12px;
        z-index: 100;
      }
      .skip:focus {
        top: 12px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 28px;
        line-height: 1.25;
        letter-spacing: -1px;
        font-weight: 670;
      }
      h2 {
        font-size: 17px;
        letter-spacing: -0.35px;
        font-weight: 650;
      }
      h3 {
        font-size: 15px;
        font-weight: 650;
      }
      p + p {
        margin-top: 8px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .between {
        justify-content: space-between;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .btn {
        border: 1px solid #d7dad4;
        border-radius: 8px;
        min-height: 44px;
        padding: 10px 15px;
        background: #fff;
        font-size: 13px;
        font-weight: 600;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        box-shadow: 0 1px 1px #00000006;
        text-decoration: none;
      }
      .btn:hover {
        background: #f8f9f6;
      }
      .btn.primary {
        background: #30382f;
        border-color: #30382f;
        color: white;
        box-shadow:
          inset 0 1px 0 #ffffff24,
          0 1px 2px #0002;
      }
      .btn.primary:hover {
        background: #1d271d;
      }
      .btn.green {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }
      .btn.quiet {
        border: 0;
        box-shadow: none;
        background: transparent;
      }
      .btn.compact {
        padding: 7px 11px;
        min-height: 36px;
      }
      .text-btn {
        padding: 10px 0;
        border: 0;
        background: transparent;
        color: var(--green);
        font-size: 13px;
        font-weight: 600;
        min-height: 44px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.5;
        padding: 3px 8px;
        border-radius: 6px;
        background: #f0f1ed;
        white-space: nowrap;
      }
      .pill.red {
        background: #fee2db;
        color: #9c3026;
      }
      .pill.amber {
        background: #ffedbf;
        color: #75520b;
      }
      .pill.green {
        background: #ddf1e4;
        color: #1b6340;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
      }
      .up {
        color: var(--green);
      }
      .down {
        color: var(--red);
      }

      .sidebar {
        width: 218px;
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        background: #ebece8;
        border-right: 1px solid #e0e2db;
        display: flex;
        flex-direction: column;
        padding: 28px 14px 18px;
        z-index: 3;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 0 8px 31px;
      }
      .brand-mark {
        width: 35px;
        height: 39px;
        background: #244e37;
        border-radius: 10px 10px 13px 13px;
        color: white;
        display: grid;
        place-items: center;
        box-shadow: inset 0 0 0 1px #fff2;
      }
      .brand strong {
        font-size: 14px;
        letter-spacing: -0.4px;
        display: block;
      }
      .brand small {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      .nav-label {
        font-size: 10px;
        color: #7c8079;
        letter-spacing: 1px;
        font-weight: 600;
        padding: 0 13px 11px;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 11px 13px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #5e645b;
        font-weight: 550;
        text-align: left;
        min-height: 45px;
      }
      .nav button:hover {
        background: #e2e6dd;
      }
      .nav button[aria-current="page"] {
        background: #d9e6d5;
        color: #254c2e;
        box-shadow: 0 1px 2px #00000003;
      }
      .nav button .nav-count {
        margin-left: auto;
        border-radius: 5px;
        min-width: 20px;
        text-align: center;
        background: #f3d9b1;
        color: #795015;
        font-size: 10px;
        padding: 1px 4px;
      }
      .sidebar-bottom {
        margin-top: auto;
      }
      .sidebar-note {
        margin: 20px 10px;
        padding: 13px 0;
        border-top: 1px solid #d9ddd4;
        font-size: 11px;
        color: #747a70;
      }
      .person {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 4px 9px;
      }
      .avatar {
        width: 31px;
        height: 31px;
        border-radius: 9px;
        background: #d7dfcb;
        display: grid;
        place-items: center;
        color: #506347;
        font-size: 12px;
        font-weight: 650;
      }
      .person strong {
        display: block;
        font-size: 12px;
      }
      .person small {
        font-size: 10px;
        color: var(--muted);
      }
      .main-shell {
        margin-left: 218px;
      }
      .topbar {
        height: 69px;
        border-bottom: 1px solid #e4e5e0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 38px;
        background: #f9faf7;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #71776c;
        font-size: 12px;
      }
      .breadcrumb b {
        font-weight: 500;
        color: #363d33;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 17px;
        color: #747a70;
        font-size: 11px;
      }
      .sync-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #2e8c5a;
        border-radius: 50%;
        margin-right: 5px;
      }
      .mobile-brand {
        display: none;
      }
      .content {
        max-width: 1280px;
        margin: auto;
        padding: 33px 38px 24px;
      }
      .page-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 25px;
      }
      .page-heading p {
        margin-top: 7px;
        color: var(--muted);
        font-size: 13px;
      }
      .heading-actions {
        display: flex;
        gap: 8px;
        padding-top: 3px;
      }
      .eyebrow {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        font-weight: 650;
        color: #7d8477;
        margin-bottom: 7px;
      }
      .panel {
        background: white;
        border: 1px solid #e1e4dc;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .panel-head {
        padding: 19px 21px 15px;
      }
      .panel-head p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
      }
      .panel-body {
        padding: 0 21px 21px;
      }
      .notice {
        border: 1px solid #f2c9bd;
        background: #fff6f2;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 17px 19px;
        margin-bottom: 23px;
      }
      .notice > .icon {
        color: #ba4a32;
        background: #ffe5db;
        border-radius: 50%;
        box-sizing: content-box;
        padding: 7px;
        width: 18px;
        height: 18px;
      }
      .notice strong {
        font-size: 13px;
        font-weight: 650;
      }
      .notice p {
        font-size: 12px;
        color: #916458;
        margin-top: 2px;
      }
      .notice .btn {
        margin-left: auto;
        background: #fffaf8;
        border-color: #e6c9bd;
        white-space: nowrap;
        font-size: 12px;
        min-height: 37px;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        margin-bottom: 28px;
      }
      .summary-item {
        padding: 0 22px;
        border-left: 1px solid #dfe2d9;
      }
      .summary-item:first-child {
        padding-left: 2px;
        border-left: 0;
      }
      .summary-item .label {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 5px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .summary-item strong {
        font-size: 27px;
        font-weight: 650;
        line-height: 1.2;
      }
      .summary-item small {
        font-size: 11px;
        margin-left: 9px;
        color: var(--muted);
      }
      .section-heading {
        margin-bottom: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .section-heading h2 {
        font-size: 15px;
      }
      .segmented {
        display: inline-flex;
        border: 1px solid #dfe2d9;
        border-color: #dfe2d9;
        padding: 3px;
        border-radius: 8px;
        background: #e9ece5;
        gap: 2px;
      }
      .segmented button {
        min-height: 32px;
        padding: 5px 11px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        font-size: 11px;
        color: #666e5f;
        font-weight: 550;
      }
      .segmented button[aria-pressed="true"] {
        background: #fff;
        color: #343d2e;
        box-shadow: 0 1px 3px #1d281a18;
      }
      .product-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 16px;
      }
      .product {
        grid-column: span 3;
        overflow: hidden;
      }
      .product.secondary {
        grid-column: span 2;
      }
      .product-main {
        padding: 21px 22px 18px;
        position: relative;
        overflow: hidden;
      }
      .product-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        position: relative;
        z-index: 1;
      }
      .product-title {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .product-title .mini-icon {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #f2f3ee;
        color: #76806c;
        display: grid;
        place-items: center;
      }
      .product-title small {
        display: block;
        font-size: 10px;
        color: var(--muted);
        margin-top: 1px;
      }
      .product-title h3 {
        font-size: 15px;
        letter-spacing: -0.3px;
      }
      .product-numbers {
        display: flex;
        align-items: flex-end;
        gap: 28px;
        margin-top: 19px;
        position: relative;
        z-index: 1;
      }
      .product-numbers .build-number {
        font-size: 48px;
        line-height: 1.05;
        font-weight: 620;
        letter-spacing: -2px;
      }
      .product-numbers .sale-number {
        font-size: 25px;
        line-height: 1.2;
        font-weight: 550;
        letter-spacing: -0.6px;
      }
      .product-numbers .metric-label {
        font-size: 11px;
        color: var(--muted);
        margin-top: 5px;
      }
      .sale {
        padding-bottom: 2px;
      }
      .tank-art {
        position: absolute;
        right: 15px;
        bottom: 7px;
        width: 83px;
        height: 120px;
        opacity: 0.87;
        filter: drop-shadow(0 5px 3px #26372510);
      }
      .product-cover {
        padding: 0 22px 15px;
      }
      .cover-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .cover-line b {
        font-weight: 600;
        color: #444d3c;
      }
      .cover-track {
        height: 5px;
        background: #ebeee7;
        border-radius: 4px;
        margin: 8px 0 10px;
        overflow: hidden;
      }
      .cover-track i {
        display: block;
        height: 100%;
        border-radius: 4px;
        background: #b0c698;
      }
      .product.red .cover-track i {
        background: #d68475;
      }
      .product.amber .cover-track i {
        background: #c6ab66;
      }
      .trend-caption {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .trend-caption b {
        font-size: 11px;
        font-weight: 600;
      }
      .product-foot {
        border-top: 1px solid #eee;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 10px 22px;
        background: #fcfdfa;
        font-size: 11px;
        min-height: 44px;
      }
      .product-foot span {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #68715f;
      }
      .product-foot .icon {
        width: 14px;
        height: 14px;
      }
      .product-foot button {
        border: 0;
        background: transparent;
        font-size: 11px;
        color: #66765a;
        min-height: 26px;
        padding: 2px 0 2px 6px;
      }
      .product-foot button:hover {
        text-decoration: underline;
      }
      .secondary .product-main {
        padding: 18px 19px 15px;
      }
      .secondary .product-title h3 {
        font-size: 13px;
      }
      .secondary .product-title .mini-icon {
        display: none;
      }
      .secondary .product-numbers {
        margin-top: 18px;
        gap: 25px;
      }
      .secondary .build-number {
        font-size: 36px;
        letter-spacing: -1.4px;
      }
      .secondary .sale-number {
        font-size: 21px;
      }
      .secondary .product-cover {
        padding: 0 19px 13px;
      }
      .secondary .product-foot {
        padding: 9px 19px;
      }
      .recipe-details {
        padding: 5px 20px 13px;
        border-top: 1px solid var(--line);
        background: #fafbf8;
      }
      .recipe-line {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 11px;
        padding: 7px 0;
        border-bottom: 1px solid #e8ebe2;
      }
      .recipe-line:last-child {
        border-bottom: 0;
      }
      .recipe-details p {
        font-size: 10px;
        color: var(--muted);
        padding-top: 6px;
      }
      .explanation {
        font-size: 11px;
        line-height: 1.7;
        color: #777d70;
        margin: 12px 1px 24px;
      }
      .explanation summary {
        cursor: pointer;
        color: #697360;
        min-height: 30px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .explanation p {
        max-width: 740px;
        margin: 4px 0 10px;
      }
      .bottom-grid {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 16px;
      }
      .task-line {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }
      .task-dot {
        width: 7px;
        height: 7px;
        background: #cc8e79;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .task-dot.amber {
        background: #c0a15d;
      }
      .task-line .grow {
        flex: 1;
      }
      .task-line b {
        font-size: 12px;
        font-weight: 600;
      }
      .task-line p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      .task-line .btn {
        font-size: 11px;
        min-height: 33px;
        padding: 5px 9px;
      }
      .mix-track {
        display: flex;
        height: 13px;
        border-radius: 5px;
        overflow: hidden;
        background: #eee;
        margin: 19px 0 15px;
        gap: 3px;
      }
      .mix-track .lite {
        background: #627c4c;
      }
      .mix-track .pro {
        background: #a5b890;
      }
      .mix-labels {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
      }
      .mix-labels b {
        color: #434d3a;
      }
      .legend-dot {
        width: 7px;
        height: 7px;
        border-radius: 2px;
        display: inline-block;
        background: #627c4c;
        margin-right: 5px;
      }
      .legend-dot.pro {
        background: #a5b890;
      }
      .panel-footer {
        padding: 10px 21px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .panel-footer .text-btn {
        min-height: 28px;
        font-size: 11px;
      }
      .page-footer {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 30px;
        padding-top: 15px;
        border-top: 1px solid #dfe3d7;
        color: #81877a;
        font-size: 10px;
      }
      .bottom-nav {
        display: none;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #d6dbce;
        background: white;
        border-radius: 8px;
        padding: 0 11px;
        max-width: 320px;
        width: 100%;
        height: 42px;
        color: var(--muted);
      }
      .search input {
        border: 0;
        background: none;
        width: 100%;
        height: 38px;
        font-size: 12px;
        outline: 0;
      }
      .filters {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .filters button {
        border: 1px solid #dce0d5;
        background: transparent;
        border-radius: 7px;
        padding: 8px 12px;
        font-size: 12px;
        min-height: 40px;
      }
      .filters button[aria-pressed="true"] {
        background: #e0e9d7;
        border-color: #cfdbc3;
        color: #35512a;
      }
      .part-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      .part-table th {
        font-weight: 550;
        font-size: 10px;
        color: var(--muted);
        padding: 12px 17px;
        background: #fafbf8;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .part-table td {
        padding: 15px 17px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .part-table tr:last-child td {
        border-bottom: 0;
      }
      .part-table td b {
        display: block;
        font-size: 12px;
        font-weight: 600;

      .part-table td small {

        }

        .product-foot button {
          min-width: 65px;

        }

        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
